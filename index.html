<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Smart Audio Guide - Universal Simulator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      touch-action: none;
      position: fixed;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }

    /* Màn hình khởi động */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 11, 20, 0.96);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .btn-start {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 30px;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.7);
      cursor: pointer;
      margin-top: 18px;
    }
    .btn-start:active { transform: scale(0.96); }

    /* Tâm ngắm (Reticle) */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      transition: all 0.15s ease;
    }
    #crosshair.locking {
      width: 30px;
      height: 30px;
      border-color: #facc15;
      background: rgba(250, 204, 21, 0.35);
      box-shadow: 0 0 18px #eab308;
    }
    #crosshair.playing {
      width: 36px;
      height: 36px;
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 24px #0284c7;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: translate(-50%, -50%) scale(0.92); }
      to { transform: translate(-50%, -50%) scale(1.12); }
    }

    /* Thanh thông báo HUD */
    .top-hud {
      position: absolute;
      top: env(safe-area-inset-top, 14px);
      left: 14px;
      right: 14px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      pointer-events: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      flex: 1;
      max-width: 480px;
    }
    .hud-title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
    }
    .hud-desc {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 4px;
      line-height: 1.4;
    }

    #desktop-guide {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: #94a3b8;
      display: none;
      pointer-events: auto;
    }
    .key-badge {
      display: inline-block;
      background: #334155;
      color: #f8fafc;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
    }

    /* Cần gạt Joystick (Chỉ kích hoạt khi chạm đúng vào vùng cần gạt) */
    #joystick-container {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 20px), 20px);
      left: 18px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px dashed rgba(255, 255, 255, 0.3);
      z-index: 20;
      touch-action: none;
    }
    #joystick-knob {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.9);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.7);
      pointer-events: none;
      transform: translate(0px, 0px);
    }

    /* Hai phím xoay góc nhanh dưới chân màn hình */
    .turn-controls {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 24px), 24px);
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 20;
    }
    .btn-rot {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      backdrop-filter: blur(8px);
      cursor: pointer;
    }
    .btn-rot:active {
      background: #0284c7;
      color: #fff;
    }

    /* Cụm nút thao tác bên phải */
    .action-controls {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 20px), 20px);
      right: 18px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .btn-stop {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid #ef4444;
      background: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-ptt {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: none;
      background: #334155;
      color: #f8fafc;
      font-weight: 700;
      font-size: 11px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
    }
    .btn-ptt.active {
      background: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- MÀN HÌNH KHỞI ĐỘNG -->
  <div id="start-overlay">
    <h1 style="font-size: 21px; color: #38bdf8; margin-bottom: 8px;">AI Audio Guide - Văn Miếu 3D</h1>
    <p style="font-size: 13px; color: #94a3b8; max-width: 320px; line-height: 1.5;">
      Tự động nhận diện cổ vật bằng góc nhìn và phát âm thanh thuyết minh.
    </p>
    <p style="font-size: 11px; color: #facc15; margin-top: 10px; max-width: 300px;">
      🔔 <b>Lưu ý trên iPhone:</b> Gạt cần gạt bên hông máy sang chế độ <b>Bật Chuông</b> và tăng âm lượng.
    </p>
    <button class="btn-start" id="btn-start">▶ BẮT ĐẦU TRẢI NGHIỆM</button>
  </div>

  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <!-- HUD THÔNG BÁO -->
  <div class="top-hud">
    <div class="hud-card">
      <div class="hud-title">
        <span id="poi-name">Đang tìm cổ vật...</span>
        <span id="poi-timer" style="color: #facc15;"></span>
      </div>
      <div class="hud-desc" id="poi-desc">Hệ thống đang quét không gian...</div>
    </div>
    <div id="desktop-guide">
      <div><span class="key-badge">W-A-S-D</span> : Đi lại</div>
      <div style="margin-top: 4px;"><b>Chuột</b> : Quay | <span class="key-badge">X</span> : Dừng | <span class="key-badge">Space</span> : Hỏi AI</div>
    </div>
  </div>

  <!-- CẦN GẠT JOYSTICK -->
  <div id="joystick-container">
    <div id="joystick-knob"></div>
  </div>

  <!-- PHÍM XOAY NHANH CHO ĐIỆN THOẠI -->
  <div class="turn-controls" id="turn-controls">
    <button class="btn-rot" id="btn-rot-left">↺ Xoay Trái</button>
    <button class="btn-rot" id="btn-rot-right">Xoay Phải ↻</button>
  </div>

  <!-- CỤM NÚT THAO TÁC -->
  <div class="action-controls">
    <button class="btn-stop" id="btn-stop" title="Phím tắt: X">✕</button>
    <button class="btn-ptt" id="btn-ptt">GIỮ ĐỂ<br>HỎI AI</button>
  </div>

  <script>
    // --- 1. BỘ TỔNG HỢP ÂM THANH WEB AUDIO API (CHỐNG LỖI 100%) ---
    let audioCtx = null;
    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Phát chuông 4 nốt Đô-Mi-Sol-Đố ngân vang cực to
    function playChimeSequence() {
      initAudioContext();
      if (!audioCtx) return;

      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      const now = audioCtx.currentTime;

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.15);

        gain.gain.setValueAtTime(0.4, now + idx * 0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.15 + 0.6);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + idx * 0.15);
        osc.stop(now + idx * 0.15 + 0.6);
      });
    }

    // Tiếng bíp phản hồi khi bấm nút
    function playBeep(freq = 880, duration = 0.08) {
      initAudioContext();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    // --- 2. NHẬN DIỆN THIẾT BỊ ---
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    const desktopGuide = document.getElementById('desktop-guide');
    if (!isTouchDevice) {
      desktopGuide.style.display = 'block';
    }

    // --- 3. KHỞI TẠO KHÔNG GIAN THREE.JS ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);
    scene.fog = new THREE.FogExp2(0x070b14, 0.035);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 80);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffedd5, 0.9);
    dirLight.position.set(5, 12, 6);
    scene.add(dirLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
    scene.add(new THREE.GridHelper(24, 24, 0x38bdf8, 0x0f172a));

    const woodMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
    [[-3.5, -4], [3.5, -4], [-3.5, 0], [3.5, 0]].forEach(([px, pz]) => {
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 4, 12), woodMat);
      pillar.position.set(px, 2, pz);
      scene.add(pillar);
    });
    const roof = new THREE.Mesh(new THREE.ConeGeometry(5.6, 1.8, 4), new THREE.MeshStandardMaterial({ color: 0x991b1b }));
    roof.position.set(0, 4.9, -2);
    roof.rotation.y = Math.PI / 4;
    scene.add(roof);

    // Dựng 3 cổ vật
    const steleGroup = new THREE.Group();
    const turtle = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 0.35, 12), new THREE.MeshStandardMaterial({ color: 0x475569 }));
    turtle.position.y = 0.18;
    const tablet = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.5, 0.2), new THREE.MeshStandardMaterial({ color: 0x64748b }));
    tablet.position.set(0, 1.1, 0);
    steleGroup.add(turtle, tablet);
    steleGroup.position.set(0, 0, -3.2); // Đặt ở vị trí z = -3.2m
    scene.add(steleGroup);

    const burner = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.25, 0.8, 12), new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.7 }));
    burner.position.set(-2.5, 0.5, -1.2);
    scene.add(burner);

    const plaque = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 0.1), new THREE.MeshStandardMaterial({ color: 0xb91c1c }));
    plaque.position.set(0, 3.6, -3.5);
    scene.add(plaque);

    const artifacts = [
      { 
        id: "POI_BIA_01", 
        name: "Bia Tiến Sĩ Cổ Triều Lê", 
        pos: new THREE.Vector3(0, 1.1, -3.2), 
        mesh: tablet, 
        audioSrc: "audio/bia_tien_si.mp3", 
        audioText: "Bia Tiến Sĩ dựng năm 1484, ghi danh các bậc hiền tài đỗ đại khoa thời vua Lê Thánh Tông." 
      },
      { 
        id: "POI_LU_HUONG", 
        name: "Lư Hương Đồng Tam Khí", 
        pos: new THREE.Vector3(-2.5, 0.6, -1.2), 
        mesh: burner, 
        audioSrc: "audio/luu_huong.mp3", 
        audioText: "Lư hương đồng đúc thủ công tam khí thời Hậu Lê, khảm hoa văn lưỡng long chầu nguyệt tinh xảo." 
      },
      { 
        id: "POI_HOANH_PHI", 
        name: "Hoành Phi 'Vạn Thế Sư Biểu'", 
        pos: new THREE.Vector3(0, 3.6, -3.5), 
        mesh: plaque, 
        audioSrc: "audio/hoanh_phi.mp3", 
        audioText: "Bức hoành phi sơn son thếp vàng ca ngợi công đức người thầy tiêu biểu của muôn đời." 
      }
    ];
    artifacts.forEach(a => { a.origColor = a.mesh.material.color.getHex(); });

    // --- 4. BIẾN ĐIỀU KHIỂN & MÁY TRẠNG THÁI ---
    // ĐẶT VỊ TRÍ XUẤT PHÁT: posX = 0, posZ = 0 (cách Bia Tiến Sĩ 3.2m -> VỪA VẶN TRONG TẦM NHÌN)
    let posX = 0, posZ = 0, posY = 1.6;
    let yaw = 0, pitch = 0;
    let isAudioPlaying = false;
    let currentPlaying = null;
    let currentLocking = null;
    let lockStartTime = 0;
    let currentAudio = null;
    const cooldownMap = {};

    const poiNameEl = document.getElementById('poi-name');
    const poiTimerEl = document.getElementById('poi-timer');
    const poiDescEl = document.getElementById('poi-desc');
    const crosshairEl = document.getElementById('crosshair');

    function stopNarration() {
      if (!isAudioPlaying) return;
      playBeep(440, 0.1);
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (currentPlaying) cooldownMap[currentPlaying.id] = Date.now() + 12000;
      
      isAudioPlaying = false;
      currentPlaying = null;
      currentLocking = null;
      lockStartTime = Date.now();
      updateLogic();
    }
    document.getElementById('btn-stop').addEventListener('click', stopNarration);

    function playNarration(item) {
      isAudioPlaying = true;
      currentPlaying = item;

      // 1. LUÔN LUÔN PHÁT TIẾNG CHUÔNG WEB AUDIO (BẢO ĐẢM CÓ ÂM THANH 100%)
      playChimeSequence();

      const onFinished = () => {
        isAudioPlaying = false;
        currentPlaying = null;
        currentAudio = null;
        cooldownMap[item.id] = Date.now() + 12000;
        lockStartTime = Date.now();
        updateLogic();
      };

      // 2. Thử nạp file audio local nếu có
      currentAudio = new Audio(item.audioSrc);
      currentAudio.addEventListener('ended', onFinished);
      currentAudio.play().catch(() => {
        // 3. Fallback đọc giọng máy tiếng Việt
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(item.audioText);
          utter.lang = 'vi-VN';
          utter.rate = 0.95;
          utter.onend = onFinished;
          utter.onerror = onFinished;
          window.speechSynthesis.speak(utter);
        } else {
          setTimeout(onFinished, 6000);
        }
      });
    }

    // --- 5. TÍNH TOÁN QUÉT TẦM NHÌN ---
    function updateLogic() {
      const yawRad = THREE.MathUtils.degToRad(yaw);
      const pitchRad = THREE.MathUtils.degToRad(pitch);

      const lookDir = new THREE.Vector3(
        Math.sin(yawRad) * Math.cos(pitchRad),
        Math.sin(pitchRad),
        -Math.cos(yawRad) * Math.cos(pitchRad)
      ).normalize();

      camera.position.set(posX, posY, posZ);
      camera.lookAt(posX + lookDir.x, posY + lookDir.y, posZ + lookDir.z);

      const eyePos = new THREE.Vector3(posX, posY, posZ);
      let detected = null;

      // Quét hình nón: Bán kính mở rộng lên 5.5 mét, góc 45 độ
      artifacts.forEach(item => {
        const toTarget = new THREE.Vector3().subVectors(item.pos, eyePos);
        const dist = toTarget.length();
        const angle = THREE.MathUtils.radToDeg(lookDir.angleTo(toTarget));

        if (dist <= 5.5 && angle <= 22.5) {
          detected = item;
          item.mesh.material.color.setHex(0x4ade80);
        } else {
          item.mesh.material.color.setHex(item.origColor);
        }
      });

      const now = Date.now();

      // MÁY TRẠNG THÁI
      if (isAudioPlaying && currentPlaying) {
        poiNameEl.innerText = `🔊 ĐANG PHÁT: ${currentPlaying.name}`;
        poiNameEl.style.color = "#38bdf8";
        poiTimerEl.innerText = "ĐANG NÓI";
        poiDescEl.innerText = "Đang phát thuyết minh. Bấm nút [✕] để dừng ngay.";
        crosshairEl.className = 'playing';
        currentLocking = null;
      } 
      else if (detected) {
        const cdLeft = Math.max(0, (cooldownMap[detected.id] || 0) - now);
        if (cdLeft > 0) {
          poiNameEl.innerText = `⏳ HỒI CHIÊU: ${detected.name}`;
          poiNameEl.style.color = "#f87171";
          poiTimerEl.innerText = `${(cdLeft / 1000).toFixed(0)}s`;
          poiDescEl.innerText = "Vừa nghe xong. Hãy quay sang nhìn hiện vật khác.";
          crosshairEl.className = '';
          lockStartTime = now;
        } else {
          if (currentLocking !== detected) {
            currentLocking = detected;
            lockStartTime = now;
          }
          const dwell = (now - lockStartTime) / 1000;
          if (dwell < 1.5) {
            poiNameEl.innerText = `🎯 ĐANG NGẮM: ${detected.name}`;
            poiNameEl.style.color = "#facc15";
            poiTimerEl.innerText = `${(1.5 - dwell).toFixed(1)}s`;
            poiDescEl.innerText = "Giữ nhìn thẳng 1.5s để kích hoạt chuông...";
            crosshairEl.className = 'locking';
          } else {
            playNarration(detected);
          }
        }
      } else {
        currentLocking = null;
        lockStartTime = now;
        if (!isAudioPlaying) {
          poiNameEl.innerText = "Đang tìm cổ vật...";
          poiNameEl.style.color = "#94a3b8";
          poiTimerEl.innerText = "";
          poiDescEl.innerText = `Góc la bàn: ${Math.round(yaw)}° | Nhìn vào Bia đá hoặc Lư hương`;
          crosshairEl.className = '';
        }
      }
    }

    // --- 6. HỆ THỐNG ĐIỀU KHIỂN CẢM ỨNG & XOAY GÓC TOÀN DIỆN ---
    // A. Cần gạt JoyStick (CHỈ hoạt động khi chạm đúng vào khung joystick)
    const joyContainer = document.getElementById('joystick-container');
    const joyKnob = document.getElementById('joystick-knob');
    let joyMove = { x: 0, z: 0 };
    let joyTouchId = null;
    let joyCenter = { x: 0, y: 0 };

    joyContainer.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.targetTouches[0];
      joyTouchId = touch.identifier;
      const rect = joyContainer.getBoundingClientRect();
      joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      updateJoyKnob(touch.clientX, touch.clientY);
    }, { passive: false });

    joyContainer.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          updateJoyKnob(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
        }
      }
    }, { passive: false });

    function endJoy(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          joyKnob.style.transform = 'translate(0px, 0px)';
          joyMove = { x: 0, z: 0 };
          joyTouchId = null;
        }
      }
    }
    joyContainer.addEventListener('touchend', endJoy);
    joyContainer.addEventListener('touchcancel', endJoy);

    function updateJoyKnob(cx, cy) {
      const maxR = 35;
      let dx = cx - joyCenter.x;
      let dy = cy - joyCenter.y;
      const dist = Math.hypot(dx, dy);
      if (dist > maxR) {
        dx = (dx / dist) * maxR;
        dy = (dy / dist) * maxR;
      }
      joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joyMove = { x: dx / maxR, z: dy / maxR };
    }

    // B. Vuốt màn hình để xoay góc nhìn (Áp dụng cho mọi vị trí ngoài joystick/nút)
    let lookTouchId = null;
    let lookLastX = 0;
    let lookLastY = 0;

    window.addEventListener('touchstart', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (e.target.closest('#joystick-container') || e.target.closest('.action-controls') || e.target.closest('.turn-controls') || e.target.closest('#start-overlay') || e.target.closest('.hud-card')) {
          continue;
        }
        if (lookTouchId === null) {
          lookTouchId = touch.identifier;
          lookLastX = touch.clientX;
          lookLastY = touch.clientY;
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === lookTouchId) {
          if (e.cancelable) e.preventDefault();
          const dx = touch.clientX - lookLastX;
          const dy = touch.clientY - lookLastY;

          yaw = (yaw + dx * 0.45 + 360) % 360;
          pitch = Math.max(-40, Math.min(40, pitch - dy * 0.35));

          lookLastX = touch.clientX;
          lookLastY = touch.clientY;
          updateLogic();
        }
      }
    }, { passive: false });

    function endLook(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === lookTouchId) {
          lookTouchId = null;
        }
      }
    }
    window.addEventListener('touchend', endLook);
    window.addEventListener('touchcancel', endLook);

    // C. Hai nút xoay nhanh trái/phải
    let rotInterval = null;
    function startRotate(step) {
      if (rotInterval) clearInterval(rotInterval);
      yaw = (yaw + step + 360) % 360;
      updateLogic();
      rotInterval = setInterval(() => {
        yaw = (yaw + step + 360) % 360;
        updateLogic();
      }, 40);
    }
    function stopRotate() {
      if (rotInterval) { clearInterval(rotInterval); rotInterval = null; }
    }

    const btnLeft = document.getElementById('btn-rot-left');
    const btnRight = document.getElementById('btn-rot-right');

    ['touchstart', 'mousedown'].forEach(ev => {
      btnLeft.addEventListener(ev, (e) => { e.preventDefault(); startRotate(-3.5); });
      btnRight.addEventListener(ev, (e) => { e.preventDefault(); startRotate(3.5); });
    });
    ['touchend', 'mouseup', 'touchcancel'].forEach(ev => {
      btnLeft.addEventListener(ev, stopRotate);
      btnRight.addEventListener(ev, stopRotate);
    });

    // D. Điều khiển Laptop (Phím W-A-S-D và Chuột)
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyX') stopNarration();
      if (e.code === 'Space' && !e.repeat) setPTT(true);
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Space') setPTT(false);
    });

    let isPointerLocked = false;
    container.addEventListener('click', () => {
      if (!isTouchDevice && !isPointerLocked) container.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', () => {
      isPointerLocked = (document.pointerLockElement === container);
    });
    document.addEventListener('mousemove', (e) => {
      if (isPointerLocked) {
        yaw = (yaw + e.movementX * 0.2 + 360) % 360;
        pitch = Math.max(-40, Math.min(40, pitch - e.movementY * 0.2));
        updateLogic();
      }
    });

    // Nút PTT
    const btnPTT = document.getElementById('btn-ptt');
    function setPTT(active) {
      if (active) {
        btnPTT.classList.add('active');
        btnPTT.innerHTML = "ĐANG<br>THU ÂM";
        playBeep(600, 0.05);
        if (isAudioPlaying) stopNarration();
      } else {
        btnPTT.classList.remove('active');
        btnPTT.innerHTML = "GIỮ ĐỂ<br>HỎI AI";
      }
    }
    btnPTT.addEventListener('touchstart', (e) => { e.preventDefault(); setPTT(true); });
    btnPTT.addEventListener('touchend', (e) => { e.preventDefault(); setPTT(false); });
    btnPTT.addEventListener('mousedown', () => setPTT(true));
    window.addEventListener('mouseup', () => setPTT(false));

    // Bắt đầu
    document.getElementById('btn-start').addEventListener('click', () => {
      document.getElementById('start-overlay').style.display = 'none';
      initAudioContext();
      playBeep(880, 0.1); // Bíp một tiếng báo hiệu đã mở khóa âm thanh
      if (!isTouchDevice) container.requestPointerLock();
      updateLogic();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // VÒNG LẶP RENDER 60 FPS
    function animate() {
      requestAnimationFrame(animate);

      const speed = 0.06;
      const yawRad = THREE.MathUtils.degToRad(yaw);
      const forward = new THREE.Vector3(Math.sin(yawRad), 0, -Math.cos(yawRad));
      const right = new THREE.Vector3(Math.cos(yawRad), 0, Math.sin(yawRad));
      let moveDir = new THREE.Vector3();

      if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(forward);
      if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(forward);
      if (keys['KeyD'] || keys['ArrowRight']) moveDir.add(right);
      if (keys['KeyA'] || keys['ArrowLeft']) moveDir.sub(right);

      if (Math.abs(joyMove.x) > 0.05 || Math.abs(joyMove.z) > 0.05) {
        moveDir.addScaledVector(forward, -joyMove.z);
        moveDir.addScaledVector(right, joyMove.x);
      }

      if (moveDir.lengthSq() > 0) {
        moveDir.normalize();
        posX = Math.max(-6, Math.min(6, posX + moveDir.x * speed));
        posZ = Math.max(-6, Math.min(6, posZ + moveDir.z * speed));
      }

      updateLogic();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
