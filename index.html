<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Smart Audio Guide - Universal Simulator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      touch-action: none;
      position: fixed;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 11, 20, 0.95);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .btn-start {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 16px 36px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 30px;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.6);
      cursor: pointer;
      margin-top: 20px;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      transition: all 0.15s ease;
    }
    #crosshair.locking {
      width: 26px;
      height: 26px;
      border-color: #facc15;
      background: rgba(250, 204, 21, 0.3);
      box-shadow: 0 0 16px #eab308;
    }
    #crosshair.playing {
      width: 32px;
      height: 32px;
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 20px #0284c7;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: translate(-50%, -50%) scale(0.95); }
      to { transform: translate(-50%, -50%) scale(1.1); }
    }
    .top-hud {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      right: 16px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 18px;
      pointer-events: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      flex: 1;
      max-width: 500px;
    }
    .hud-title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
    }
    .hud-desc {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 4px;
      line-height: 1.4;
    }
    #desktop-guide {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      color: #94a3b8;
      display: none;
      pointer-events: auto;
    }
    .key-badge {
      display: inline-block;
      background: #334155;
      color: #f8fafc;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
      border: 1px solid #475569;
    }
    #joystick-container {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 24px), 24px);
      left: 24px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      z-index: 20;
      display: none;
    }
    #joystick-knob {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.85);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
      pointer-events: none;
      transform: translate(0px, 0px);
    }
    .action-controls {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 24px), 24px);
      right: 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .btn-stop {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #ef4444;
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-ptt {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: #334155;
      color: #f8fafc;
      font-weight: 700;
      font-size: 11px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
    }
    .btn-ptt.active {
      background: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h1 style="font-size: 22px; color: #38bdf8; margin-bottom: 8px;">AI Audio Guide - Di Tích Văn Miếu</h1>
    <p id="overlay-instruct" style="font-size: 13px; color: #94a3b8; max-width: 360px; line-height: 1.6;">
      Hệ thống tự động kích hoạt thuyết minh khi bạn tiến gần và nhìn thẳng vào cổ vật.
    </p>
    <button class="btn-start" id="btn-start">BẮT ĐẦU TRẢI NGHIỆM</button>
  </div>

  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <div class="top-hud">
    <div class="hud-card">
      <div class="hud-title">
        <span id="poi-name">Đang tìm cổ vật...</span>
        <span id="poi-timer" style="color: #facc15;"></span>
      </div>
      <div class="hud-desc" id="poi-desc">Hệ thống đang quét không gian...</div>
    </div>
    <div id="desktop-guide">
      <div><span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> : Di chuyển</div>
      <div style="margin-top: 4px;"><b>Chuột</b> : Quay đầu | <span class="key-badge">X</span> : Ngắt bài | <span class="key-badge">Space</span> : Hỏi AI</div>
    </div>
  </div>

  <div id="joystick-container">
    <div id="joystick-knob"></div>
  </div>

  <div class="action-controls">
    <button class="btn-stop" id="btn-stop" title="Phím tắt: X">✕</button>
    <button class="btn-ptt" id="btn-ptt" title="Phím tắt: Space">GIỮ ĐỂ<br>HỎI AI</button>
  </div>

  <script>
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    const joystickContainer = document.getElementById('joystick-container');
    const desktopGuide = document.getElementById('desktop-guide');
    const overlayInstruct = document.getElementById('overlay-instruct');

    if (isTouchDevice) {
      joystickContainer.style.display = 'block';
      desktopGuide.style.display = 'none';
      overlayInstruct.innerHTML = "<b>Điện thoại:</b> Tay trái kéo cần gạt để đi lại. Tay phải vuốt trên màn hình để quay đầu.";
    } else {
      joystickContainer.style.display = 'none';
      desktopGuide.style.display = 'block';
      overlayInstruct.innerHTML = "<b>Laptop:</b> Nhấp chuột để quay đầu, <span class='key-badge'>W-A-S-D</span> để đi lại, <span class='key-badge'>Space</span> để hỏi AI.";
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);
    scene.fog = new THREE.FogExp2(0x070b14, 0.04);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 80);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dirLight = new THREE.DirectionalLight(0xffedd5, 0.85);
    dirLight.position.set(5, 12, 6);
    scene.add(dirLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(22, 22),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
    scene.add(new THREE.GridHelper(22, 22, 0x38bdf8, 0x0f172a));

    const woodMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
    [[-3.5, -4], [3.5, -4], [-3.5, 0], [3.5, 0]].forEach(([px, pz]) => {
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 4, 12), woodMat);
      pillar.position.set(px, 2, pz);
      scene.add(pillar);
    });
    const roof = new THREE.Mesh(new THREE.ConeGeometry(5.6, 1.8, 4), new THREE.MeshStandardMaterial({ color: 0x991b1b }));
    roof.position.set(0, 4.9, -2);
    roof.rotation.y = Math.PI / 4;
    scene.add(roof);

    // Cổ vật
    const steleGroup = new THREE.Group();
    const turtle = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 0.35, 12), new THREE.MeshStandardMaterial({ color: 0x475569 }));
    turtle.position.y = 0.18;
    const tablet = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.5, 0.2), new THREE.MeshStandardMaterial({ color: 0x64748b }));
    tablet.position.set(0, 1.1, 0);
    steleGroup.add(turtle, tablet);
    steleGroup.position.set(0, 0, -3.8);
    scene.add(steleGroup);

    const burner = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.25, 0.8, 12), new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.7 }));
    burner.position.set(-2.8, 0.5, -1.5);
    scene.add(burner);

    const plaque = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 0.1), new THREE.MeshStandardMaterial({ color: 0xb91c1c }));
    plaque.position.set(0, 3.6, -3.9);
    scene.add(plaque);

    const artifacts = [
      { id: "POI_BIA_01", name: "Bia Tiến Sĩ Cổ Triều Lê", pos: new THREE.Vector3(0, 1.1, -3.8), mesh: tablet, audioSrc: "audio/bia_tien_si.mp3", audioText: "Bia Tiến Sĩ dựng năm 1484, ghi danh các bậc hiền tài đỗ đại khoa thời vua Lê Thánh Tông." },
      { id: "POI_LU_HUONG", name: "Lư Hương Đồng Tam Khí", pos: new THREE.Vector3(-2.8, 0.6, -1.5), mesh: burner, audioSrc: "audio/luu_huong.mp3", audioText: "Lư hương đồng đúc thủ công tam khí thời Hậu Lê, khảm hoa văn lưỡng long chầu nguyệt tinh xảo." },
      { id: "POI_HOANH_PHI", name: "Hoành Phi 'Vạn Thế Sư Biểu'", pos: new THREE.Vector3(0, 3.6, -3.9), mesh: plaque, audioSrc: "audio/hoanh_phi.mp3", audioText: "Bức hoành phi sơn son thếp vàng ca ngợi công đức người thầy tiêu biểu của muôn đời." }
    ];
    artifacts.forEach(a => { a.origColor = a.mesh.material.color.getHex(); });

    let posX = 0, posZ = 2, posY = 1.6;
    let yaw = 0, pitch = 0;
    let isAudioPlaying = false;
    let currentPlaying = null;
    let currentLocking = null;
    let lockStartTime = 0;
    let currentAudio = null;
    const cooldownMap = {};

    const poiNameEl = document.getElementById('poi-name');
    const poiTimerEl = document.getElementById('poi-timer');
    const poiDescEl = document.getElementById('poi-desc');
    const crosshairEl = document.getElementById('crosshair');

    function stopNarration() {
      if (!isAudioPlaying) return;
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (currentPlaying) cooldownMap[currentPlaying.id] = Date.now() + 15000;
      
      isAudioPlaying = false;
      currentPlaying = null;
      currentLocking = null;
      lockStartTime = Date.now();
      updateLogic();
    }
    document.getElementById('btn-stop').addEventListener('click', stopNarration);

    function playNarration(item) {
      isAudioPlaying = true;
      currentPlaying = item;

      if (currentAudio) { currentAudio.pause(); currentAudio = null; }

      const onFinished = () => {
        isAudioPlaying = false;
        currentPlaying = null;
        currentAudio = null;
        cooldownMap[item.id] = Date.now() + 15000;
        lockStartTime = Date.now();
        updateLogic();
      };

      currentAudio = new Audio(item.audioSrc);
      currentAudio.addEventListener('ended', onFinished);
      currentAudio.play().catch(err => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(item.audioText);
          utter.lang = 'vi-VN';
          utter.rate = 0.95;
          window.activeUtterance = utter;
          utter.onend = onFinished;
          utter.onerror = onFinished;
          window.speechSynthesis.speak(utter);
        } else {
          setTimeout(onFinished, 5000);
        }
      });
    }

    function updateLogic() {
      const yawRad = THREE.MathUtils.degToRad(yaw);
      const pitchRad = THREE.MathUtils.degToRad(pitch);

      const lookDir = new THREE.Vector3(
        Math.sin(yawRad) * Math.cos(pitchRad),
        Math.sin(pitchRad),
        -Math.cos(yawRad) * Math.cos(pitchRad)
      ).normalize();

      camera.position.set(posX, posY, posZ);
      camera.lookAt(posX + lookDir.x, posY + lookDir.y, posZ + lookDir.z);

      const eyePos = new THREE.Vector3(posX, posY, posZ);
      let detected = null;

      artifacts.forEach(item => {
        const toTarget = new THREE.Vector3().subVectors(item.pos, eyePos);
        const dist = toTarget.length();
        const angle = THREE.MathUtils.radToDeg(lookDir.angleTo(toTarget));

        if (dist <= 4.2 && angle <= 22.5) {
          detected = item;
          item.mesh.material.color.setHex(0x4ade80);
        } else {
          item.mesh.material.color.setHex(item.origColor);
        }
      });

      const now = Date.now();

      if (isAudioPlaying && currentPlaying) {
        poiNameEl.innerText = `🔊 ĐANG PHÁT: ${currentPlaying.name}`;
        poiNameEl.style.color = "#38bdf8";
        poiTimerEl.innerText = "";
        poiDescEl.innerText = isTouchDevice ? "Đang nghe thuyết minh. Bấm nút [✕] để ngắt bài." : "Đang nghe thuyết minh. Nhấn phím [X] để ngắt bài.";
        crosshairEl.className = 'playing';
        currentLocking = null;
      } 
      else if (detected) {
        const cdLeft = Math.max(0, (cooldownMap[detected.id] || 0) - now);
        if (cdLeft > 0) {
          poiNameEl.innerText = `⏳ HỒI CHIÊU: ${detected.name}`;
          poiNameEl.style.color = "#f87171";
          poiTimerEl.innerText = `${(cdLeft / 1000).toFixed(0)}s`;
          poiDescEl.innerText = "Cổ vật vừa nghe xong. Vui lòng tham quan hiện vật khác.";
          crosshairEl.className = '';
          lockStartTime = now;
        } else {
          if (currentLocking !== detected) {
            currentLocking = detected;
            lockStartTime = now;
          }
          const dwell = (now - lockStartTime) / 1000;
          if (dwell < 1.5) {
            poiNameEl.innerText = `🎯 ĐANG NGẮM: ${detected.name}`;
            poiNameEl.style.color = "#facc15";
            poiTimerEl.innerText = `${(1.5 - dwell).toFixed(1)}s`;
            poiDescEl.innerText = "Giữ nhìn thẳng để kích hoạt thuyết minh...";
            crosshairEl.className = 'locking';
          } else {
            playNarration(detected);
          }
        }
      } else {
        currentLocking = null;
        lockStartTime = now;
        if (!isAudioPlaying) {
          poiNameEl.innerText = "Đang tìm cổ vật...";
          poiNameEl.style.color = "#94a3b8";
          poiTimerEl.innerText = "";
          poiDescEl.innerText = `Vị trí: (${posX.toFixed(1)}, ${posZ.toFixed(1)}) | Góc la bàn: ${Math.round(yaw)}°`;
          crosshairEl.className = '';
        }
      }
    }

    // Điều khiển Laptop
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyX') stopNarration();
      if (e.code === 'Space' && !e.repeat) setPTTState(true);
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Space') setPTTState(false);
    });

    let isPointerLocked = false;
    container.addEventListener('click', () => {
      if (!isTouchDevice && !isPointerLocked) container.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', () => {
      isPointerLocked = (document.pointerLockElement === container);
    });
    document.addEventListener('mousemove', (e) => {
      if (isPointerLocked) {
        yaw = (yaw + e.movementX * 0.2 + 360) % 360;
        pitch = Math.max(-45, Math.min(45, pitch - e.movementY * 0.2));
        updateLogic();
      }
    });

    // Điều khiển Cảm ứng Điện thoại (Tách ID độc lập)
    let joyMove = { x: 0, z: 0 };
    let joyTouchId = null;
    let joyCenter = { x: 0, y: 0 };
    const joyKnob = document.getElementById('joystick-knob');

    let lookTouchId = null;
    let lookLastX = 0;
    let lookLastY = 0;

    window.addEventListener('touchstart', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (e.target.closest('#btn-ptt') || e.target.closest('#btn-stop') || e.target.closest('#btn-start')) continue;

        if (touch.clientX < window.innerWidth * 0.45 && joyTouchId === null) {
          joyTouchId = touch.identifier;
          const rect = joystickContainer.getBoundingClientRect();
          joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
          handleJoy(touch.clientX, touch.clientY);
        } else if (touch.clientX >= window.innerWidth * 0.45 && lookTouchId === null) {
          lookTouchId = touch.identifier;
          lookLastX = touch.clientX;
          lookLastY = touch.clientY;
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.cancelable) e.preventDefault();

      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
          handleJoy(touch.clientX, touch.clientY);
        } else if (touch.identifier === lookTouchId) {
          const dx = touch.clientX - lookLastX;
          const dy = touch.clientY - lookLastY;
          yaw = (yaw + dx * 0.4 + 360) % 360;
          pitch = Math.max(-45, Math.min(45, pitch - dy * 0.35));
          lookLastX = touch.clientX;
          lookLastY = touch.clientY;
          updateLogic();
        }
      }
    }, { passive: false });

    function handleJoy(clientX, clientY) {
      const maxR = 40;
      let dx = clientX - joyCenter.x;
      let dy = clientY - joyCenter.y;
      const dist = Math.hypot(dx, dy);
      if (dist > maxR) {
        dx = (dx / dist) * maxR;
        dy = (dy / dist) * maxR;
      }
      joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
      joyMove = { x: dx / maxR, z: dy / maxR };
    }

    function handleTouchEnd(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
          joyKnob.style.transform = 'translate(0px, 0px)';
          joyMove = { x: 0, z: 0 };
          joyTouchId = null;
        }
        if (touch.identifier === lookTouchId) {
          lookTouchId = null;
        }
      }
    }
    window.addEventListener('touchend', handleTouchEnd);
    window.addEventListener('touchcancel', handleTouchEnd);

    // Nút PTT
    const btnPTT = document.getElementById('btn-ptt');
    function setPTTState(active) {
      if (active) {
        btnPTT.classList.add('active');
        btnPTT.innerHTML = "ĐANG<br>THU ÂM";
        if (isAudioPlaying) stopNarration();
      } else {
        btnPTT.classList.remove('active');
        btnPTT.innerHTML = isTouchDevice ? "GIỮ ĐỂ<br>HỎI AI" : "GIỮ ĐỂ<br>HỎI AI<br><small>[Space]</small>";
      }
    }
    btnPTT.addEventListener('mousedown', () => setPTTState(true));
    window.addEventListener('mouseup', () => setPTTState(false));
    btnPTT.addEventListener('touchstart', (e) => { e.preventDefault(); setPTTState(true); });
    btnPTT.addEventListener('touchend', (e) => { e.preventDefault(); setPTTState(false); });

    document.getElementById('btn-start').addEventListener('click', () => {
      document.getElementById('start-overlay').style.display = 'none';
      const silentAudio = new Audio();
      silentAudio.play().catch(() => {});
      if ('speechSynthesis' in window) window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
      if (!isTouchDevice) container.requestPointerLock();
      updateLogic();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);

      const speed = 0.06;
      const yawRad = THREE.MathUtils.degToRad(yaw);
      const forward = new THREE.Vector3(Math.sin(yawRad), 0, -Math.cos(yawRad));
      const right = new THREE.Vector3(Math.cos(yawRad), 0, Math.sin(yawRad));
      let moveDir = new THREE.Vector3();

      if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(forward);
      if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(forward);
      if (keys['KeyD'] || keys['ArrowRight']) moveDir.add(right);
      if (keys['KeyA'] || keys['ArrowLeft']) moveDir.sub(right);

      if (Math.abs(joyMove.x) > 0.05 || Math.abs(joyMove.z) > 0.05) {
        moveDir.addScaledVector(forward, -joyMove.z);
        moveDir.addScaledVector(right, joyMove.x);
      }

      if (moveDir.lengthSq() > 0) {
        moveDir.normalize();
        posX = Math.max(-6, Math.min(6, posX + moveDir.x * speed));
        posZ = Math.max(-6, Math.min(6, posZ + moveDir.z * speed));
      }

      updateLogic();
      renderer.render(scene, camera);
    }
    animate();
  </script>
