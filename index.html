<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AI Audio Guide - Dual Touch Simulator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070b14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      touch-action: none;
      position: fixed;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* Màn hình mở khóa ban đầu */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 11, 20, 0.96);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .btn-start {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 16px 42px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 30px;
      box-shadow: 0 0 25px rgba(2, 132, 199, 0.7);
      cursor: pointer;
      margin-top: 18px;
    }
    .btn-start:active { transform: scale(0.96); }

    /* Tâm ngắm */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      transition: all 0.15s ease;
    }
    #crosshair.locking {
      width: 32px;
      height: 32px;
      border-color: #facc15;
      background: rgba(250, 204, 21, 0.35);
      box-shadow: 0 0 18px #eab308;
    }
    #crosshair.playing {
      width: 38px;
      height: 38px;
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.45);
      box-shadow: 0 0 24px #0284c7;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: translate(-50%, -50%) scale(0.92); }
      to { transform: translate(-50%, -50%) scale(1.12); }
    }

    /* Bảng thông báo trên cùng */
    .top-hud {
      position: absolute;
      top: env(safe-area-inset-top, 14px);
      left: 14px;
      right: 14px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .hud-card {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      flex: 1;
      max-width: 480px;
    }
    .hud-title {
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
    }
    .hud-desc {
      font-size: 12px;
      color: #cbd5e1;
      margin-top: 4px;
      line-height: 1.4;
    }

    /* CẦN GẠT TỰ ĐỘNG BÁM THEO NGÓN TAY TRÁI (Floating Joystick) */
    #joystick-base {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 2px dashed rgba(56, 189, 248, 0.5);
      z-index: 20;
      pointer-events: none;
      display: none;
      transform: translate(-50%, -50%);
    }
    #joystick-knob {
      position: absolute;
      top: 35px;
      left: 35px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.95);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.8);
      pointer-events: none;
      transform: translate(0px, 0px);
    }

    /* Chỉ dẫn vùng cảm ứng mờ mờ ở đáy màn hình */
    .touch-hint {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 16px), 16px);
      left: 20px;
      font-size: 11px;
      color: rgba(148, 163, 184, 0.6);
      pointer-events: none;
      z-index: 5;
    }

    /* Cụm nút thao tác bên phải */
    .action-controls {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom, 20px), 20px);
      right: 18px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .btn-stop {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid #ef4444;
      background: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .btn-ptt {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      background: #334155;
      color: #f8fafc;
      font-weight: 700;
      font-size: 11px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
    }
    .btn-ptt.active {
      background: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <!-- MÀN HÌNH KHỞI ĐỘNG -->
  <div id="start-overlay">
    <h1 style="font-size: 21px; color: #38bdf8; margin-bottom: 8px;">AI Audio Guide - Văn Miếu 3D</h1>
    <p style="font-size: 13px; color: #94a3b8; max-width: 320px; line-height: 1.5;">
      Chạm nửa trái để di chuyển. Vuốt nửa phải để xoay góc nhìn xung quanh.
    </p>
    <p style="font-size: 12px; color: #facc15; margin-top: 10px;">
        tăng âm lượng điện thoại!
    </p>
    <button class="btn-start" id="btn-start">▶ BẮT ĐẦU NGAY</button>
  </div>

  <div id="canvas-container"></div>
  <div id="crosshair"></div>

  <!-- HUD THÔNG BÁO -->
  <div class="top-hud">
    <div class="hud-card">
      <div class="hud-title">
        <span id="poi-name">Đang tìm cổ vật...</span>
        <span id="poi-timer" style="color: #facc15;"></span>
      </div>
      <div class="hud-desc" id="poi-desc">Tay trái: Đi bộ | Tay phải: Quay đầu nhìn</div>
    </div>
  </div>

  <div class="touch-hint"></div>

  <!-- CẦN GẠT JOYSTICK ẢO TỰ ĐỘNG HIỆN DƯỚI TAY TRÁI -->
  <div id="joystick-base">
    <div id="joystick-knob"></div>
  </div>

  <!-- NÚT ĐIỀU KHIỂN BÊN PHẢI -->
  <div class="action-controls">
    <button class="btn-stop" id="btn-stop">✕</button>
    <button class="btn-ptt" id="btn-ptt">GIỮ ĐỂ<br>HỎI AI</button>
  </div>

  <script>
    // --- 1. HỆ THỐNG ÂM THANH WEB AUDIO (CHỐNG LỖI 100%) ---
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playChime() {
      const ctx = getAudioContext();
      if (!ctx) return;
      const notes = [523.25, 659.25, 783.99, 1046.50]; // Đô - Mi - Sol - Đố
      const now = ctx.currentTime;

      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.14);
        gain.gain.setValueAtTime(0.45, now + i * 0.14);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.14 + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.14);
        osc.stop(now + i * 0.14 + 0.6);
      });
    }

    function playBeep(freq = 880, dur = 0.08) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.25, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + dur);
    }

    // --- 2. DỰNG KHÔNG GIAN 3D THREE.JS ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);
    scene.fog = new THREE.FogExp2(0x070b14, 0.035);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 80);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const dirLight = new THREE.DirectionalLight(0xffedd5, 0.9);
    dirLight.position.set(5, 12, 6);
    scene.add(dirLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);
    scene.add(new THREE.GridHelper(24, 24, 0x38bdf8, 0x0f172a));

    const woodMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
    [[-3.5, -4], [3.5, -4], [-3.5, 0], [3.5, 0]].forEach(([px, pz]) => {
      const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 4, 12), woodMat);
      pillar.position.set(px, 2, pz);
      scene.add(pillar);
    });
    const roof = new THREE.Mesh(new THREE.ConeGeometry(5.6, 1.8, 4), new THREE.MeshStandardMaterial({ color: 0x991b1b }));
    roof.position.set(0, 4.9, -2);
    roof.rotation.y = Math.PI / 4;
    scene.add(roof);

    // Bia Tiến Sĩ (Đặt ở z = -2.8m, ngay trước mặt điểm xuất phát)
    const steleGroup = new THREE.Group();
    const turtle = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 0.35, 12), new THREE.MeshStandardMaterial({ color: 0x475569 }));
    turtle.position.y = 0.18;
    const tablet = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.5, 0.2), new THREE.MeshStandardMaterial({ color: 0x64748b }));
    tablet.position.set(0, 1.1, 0);
    steleGroup.add(turtle, tablet);
    steleGroup.position.set(0, 0, -2.8);
    scene.add(steleGroup);

    // Lư Hương Đồng (Đặt ở bên trái)
    const burner = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.25, 0.8, 12), new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.7 }));
    burner.position.set(-2.5, 0.5, -1.2);
    scene.add(burner);

    // Hoành Phi (Đặt ở trên cao)
    const plaque = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 0.1), new THREE.MeshStandardMaterial({ color: 0xb91c1c }));
    plaque.position.set(0, 3.6, -3.2);
    scene.add(plaque);

    const artifacts = [
      { id: "POI_BIA_01", name: "Bia Tiến Sĩ Cổ Triều Lê", pos: new THREE.Vector3(0, 1.1, -2.8), mesh: tablet, audioSrc: "audio/bia_tien_si.mp3", audioText: "Bia Tiến Sĩ dựng năm 1484, ghi danh các bậc hiền tài đỗ đại khoa thời vua Lê Thánh Tông." },
      { id: "POI_LU_HUONG", name: "Lư Hương Đồng Tam Khí", pos: new THREE.Vector3(-2.5, 0.6, -1.2), mesh: burner, audioSrc: "audio/lu_huong.mp3", audioText: "Lư hương đồng đúc thủ công tam khí thời Hậu Lê, khảm hoa văn lưỡng long chầu nguyệt tinh xảo." },
      { id: "POI_HOANH_PHI", name: "Hoành Phi 'Vạn Thế Sư Biểu'", pos: new THREE.Vector3(0, 3.6, -3.2), mesh: plaque, audioSrc: "audio/hoanh_phi.mp3", audioText: "Bức hoành phi sơn son thếp vàng ca ngợi công đức người thầy tiêu biểu của muôn đời." }
    ];
    artifacts.forEach(a => { a.origColor = a.mesh.material.color.getHex(); });

    // --- 3. BIẾN ĐIỀU KHIỂN & MÁY TRẠNG THÁI ---
    let posX = 0, posZ = 0, posY = 1.6; // Đứng cách Bia Tiến Sĩ 2.8m
    let yaw = 0, pitch = 0;
    let isAudioPlaying = false;
    let currentPlaying = null;
    let currentLocking = null;
    let lockStartTime = 0;
    let currentAudio = null;
    const cooldownMap = {};

    const poiNameEl = document.getElementById('poi-name');
    const poiTimerEl = document.getElementById('poi-timer');
    const poiDescEl = document.getElementById('poi-desc');
    const crosshairEl = document.getElementById('crosshair');

    function stopNarration() {
      if (!isAudioPlaying) return;
      playBeep(440, 0.1);
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      if (currentPlaying) cooldownMap[currentPlaying.id] = Date.now() + 12000;
      
      isAudioPlaying = false;
      currentPlaying = null;
      currentLocking = null;
      lockStartTime = Date.now();
      updateLogic();
    }
    document.getElementById('btn-stop').addEventListener('click', (e) => {
      e.stopPropagation();
      stopNarration();
    });

    function playNarration(item) {
      isAudioPlaying = true;
      currentPlaying = item;
      playChime(); // Phát chuông 4 nốt ngay lập tức

      const onFinished = () => {
        isAudioPlaying = false;
        currentPlaying = null;
        currentAudio = null;
        cooldownMap[item.id] = Date.now() + 12000;
        lockStartTime = Date.now();
        updateLogic();
      };

      currentAudio = new Audio(item.audioSrc);
      currentAudio.addEventListener('ended', onFinished);
      currentAudio.play().catch(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(item.audioText);
          utter.lang = 'vi-VN';
          utter.rate = 0.95;
          utter.onend = onFinished;
          utter.onerror = onFinished;
          window.speechSynthesis.speak(utter);
        } else {
          setTimeout(onFinished, 6000);
        }
      });
    }

    function updateLogic() {
      const yawRad = THREE.MathUtils.degToRad(yaw);
      const pitchRad = THREE.MathUtils.degToRad(pitch);

      const lookDir = new THREE.Vector3(
        Math.sin(yawRad) * Math.cos(pitchRad),
        Math.sin(pitchRad),
        -Math.cos(yawRad) * Math.cos(pitchRad)
      ).normalize();

      camera.position.set(posX, posY, posZ);
      camera.lookAt(posX + lookDir.x, posY + lookDir.y, posZ + lookDir.z);

      const eyePos = new THREE.Vector3(posX, posY, posZ);
      let detected = null;

      artifacts.forEach(item => {
        const toTarget = new THREE.Vector3().subVectors(item.pos, eyePos);
        const dist = toTarget.length();
        const angle = THREE.MathUtils.radToDeg(lookDir.angleTo(toTarget));

        if (dist <= 5.2 && angle <= 25.0) {
          detected = item;
          item.mesh.material.color.setHex(0x4ade80);
        } else {
          item.mesh.material.color.setHex(item.origColor);
        }
      });

      const now = Date.now();

      if (isAudioPlaying && currentPlaying) {
        poiNameEl.innerText = `🔊 ĐANG PHÁT: ${currentPlaying.name}`;
        poiNameEl.style.color = "#38bdf8";
        poiTimerEl.innerText = "ĐANG NÓI";
        poiDescEl.innerText = "Đang nghe thuyết minh. Bấm nút [✕] để ngắt bài.";
        crosshairEl.className = 'playing';
        currentLocking = null;
      } 
      else if (detected) {
        const cdLeft = Math.max(0, (cooldownMap[detected.id] || 0) - now);
        if (cdLeft > 0) {
          poiNameEl.innerText = `⏳ HỒI CHIÊU: ${detected.name}`;
          poiNameEl.style.color = "#f87171";
          poiTimerEl.innerText = `${(cdLeft / 1000).toFixed(0)}s`;
          poiDescEl.innerText = "Cổ vật vừa nghe xong. Vui lòng quay sang vật khác.";
          crosshairEl.className = '';
          lockStartTime = now;
        } else {
          if (currentLocking !== detected) {
            currentLocking = detected;
            lockStartTime = now;
          }
          const dwell = (now - lockStartTime) / 1000;
          if (dwell < 1.5) {
            poiNameEl.innerText = `🎯 ĐANG NGẮM: ${detected.name}`;
            poiNameEl.style.color = "#facc15";
            poiTimerEl.innerText = `${(1.5 - dwell).toFixed(1)}s`;
            poiDescEl.innerText = "Giữ nhìn thẳng 1.5s để nghe thuyết minh...";
            crosshairEl.className = 'locking';
          } else {
            playNarration(detected);
          }
        }
      } else {
        currentLocking = null;
        lockStartTime = now;
        if (!isAudioPlaying) {
          poiNameEl.innerText = "Đang tìm cổ vật...";
          poiNameEl.style.color = "#94a3b8";
          poiTimerEl.innerText = "";
          poiDescEl.innerText = `Tọa độ: (${posX.toFixed(1)}, ${posZ.toFixed(1)}) | Góc la bàn: ${Math.round(yaw)}°`;
          crosshairEl.className = '';
        }
      }
    }

    // --- 4. HỆ THỐNG ĐA ĐIỂM HỢP NHẤT (UNIFIED DUAL TOUCH ENGINE) ---
    // Ngón 1 (Nửa trái): Di chuyển (Move)
    let moveTouchId = null;
    let joyOrigin = { x: 0, y: 0 };
    let joyMove = { x: 0, z: 0 };
    const joyBase = document.getElementById('joystick-base');
    const joyKnob = document.getElementById('joystick-knob');

    // Ngón 2 (Nửa phải): Xoay góc nhìn (Look)
    let lookTouchId = null;
    let lookLastX = 0;
    let lookLastY = 0;

    // Bộ lắng nghe hợp nhất DUY NHẤT trên toàn màn hình
    window.addEventListener('touchstart', (e) => {
      // Bỏ qua nếu chạm vào màn hình bắt đầu
      if (e.target.closest('#start-overlay')) return;

      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];

        // Bỏ qua nút PTT và nút Stop (đã có handler riêng)
        if (e.target.closest('.action-controls')) continue;

        // VÙNG TRÁI: ĐI BỘ (Chạm ở nửa bên trái màn hình)
        if (touch.clientX < window.innerWidth * 0.5) {
          if (moveTouchId === null) {
            moveTouchId = touch.identifier;
            joyOrigin = { x: touch.clientX, y: touch.clientY };

            // Hiện cần gạt ngay dưới ngón tay cái bên trái
            joyBase.style.left = touch.clientX + 'px';
            joyBase.style.top = touch.clientY + 'px';
            joyBase.style.display = 'block';
            joyKnob.style.transform = 'translate(0px, 0px)';
            joyMove = { x: 0, z: 0 };
          }
        } 
        // VÙNG PHẢI: QUAY ĐẦU (Chạm ở nửa bên phải màn hình)
        else {
          if (lookTouchId === null) {
            lookTouchId = touch.identifier;
            lookLastX = touch.clientX;
            lookLastY = touch.clientY;
          }
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.cancelable) e.preventDefault(); // Chặn cuộn trang triệt để

      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];

        // 1. CẬP NHẬT ĐI BỘ
        if (touch.identifier === moveTouchId) {
          const maxR = 38;
          let dx = touch.clientX - joyOrigin.x;
          let dy = touch.clientY - joyOrigin.y;
          const dist = Math.hypot(dx, dy);

          if (dist > maxR) {
            dx = (dx / dist) * maxR;
            dy = (dy / dist) * maxR;
          }
          joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
          joyMove = { x: dx / maxR, z: dy / maxR };
        }

        // 2. CẬP NHẬT QUAY ĐẦU (Chạy song song cùng lúc!)
        if (touch.identifier === lookTouchId) {
          const dx = touch.clientX - lookLastX;
          const dy = touch.clientY - lookLastY;

          yaw = (yaw + dx * 0.45 + 360) % 360;
          pitch = Math.max(-42, Math.min(42, pitch - dy * 0.35));

          lookLastX = touch.clientX;
          lookLastY = touch.clientY;
          updateLogic();
        }
      }
    }, { passive: false });

    function handleTouchEnd(e) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];

        if (touch.identifier === moveTouchId) {
          moveTouchId = null;
          joyBase.style.display = 'none';
          joyMove = { x: 0, z: 0 };
        }
        if (touch.identifier === lookTouchId) {
          lookTouchId = null;
        }
      }
    }
    window.addEventListener('touchend', handleTouchEnd);
    window.addEventListener('touchcancel', handleTouchEnd);

    // --- 5. ĐIỀU KHIỂN BÀN PHÍM LAPTOP (HỖ TRỢ SONG SONG) ---
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyX') stopNarration();
      if (e.code === 'Space' && !e.repeat) setPTT(true);
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'Space') setPTT(false);
    });

    let isPointerLocked = false;
    container.addEventListener('click', () => {
      if (!('ontouchstart' in window) && !isPointerLocked) container.requestPointerLock();
    });
    document.addEventListener('pointerlockchange', () => {
      isPointerLocked = (document.pointerLockElement === container);
    });
    document.addEventListener('mousemove', (e) => {
      if (isPointerLocked) {
        yaw = (yaw + e.movementX * 0.2 + 360) % 360;
        pitch = Math.max(-42, Math.min(42, pitch - e.movementY * 0.2));
        updateLogic();
      }
    });

    // Nút PTT
    const btnPTT = document.getElementById('btn-ptt');
    function setPTT(active) {
      if (active) {
        btnPTT.classList.add('active');
        btnPTT.innerHTML = "ĐANG<br>THU ÂM";
        playBeep(600, 0.05);
        if (isAudioPlaying) stopNarration();
      } else {
        btnPTT.classList.remove('active');
        btnPTT.innerHTML = "GIỮ ĐỂ<br>HỎI AI";
      }
    }
    btnPTT.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); setPTT(true); });
    btnPTT.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); setPTT(false); });
    btnPTT.addEventListener('mousedown', () => setPTT(true));
    window.addEventListener('mouseup', () => setPTT(false));

    // Nút Bắt đầu
    document.getElementById('btn-start').addEventListener('click', () => {
      document.getElementById('start-overlay').style.display = 'none';
      getAudioContext();
      playBeep(880, 0.1);
      updateLogic();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 6. VÒNG LẶP GAME 60 FPS ---
    function animate() {
      requestAnimationFrame(animate);

      const speed = 0.065;
      const yawRad = THREE.MathUtils.degToRad(yaw);
      const forward = new THREE.Vector3(Math.sin(yawRad), 0, -Math.cos(yawRad));
      const right = new THREE.Vector3(Math.cos(yawRad), 0, Math.sin(yawRad));
      let moveDir = new THREE.Vector3();

      // Bàn phím Laptop
      if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(forward);
      if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(forward);
      if (keys['KeyD'] || keys['ArrowRight']) moveDir.add(right);
      if (keys['KeyA'] || keys['ArrowLeft']) moveDir.sub(right);

      // Cần gạt cảm ứng điện thoại
      if (Math.abs(joyMove.x) > 0.05 || Math.abs(joyMove.z) > 0.05) {
        moveDir.addScaledVector(forward, -joyMove.z);
        moveDir.addScaledVector(right, joyMove.x);
      }

      if (moveDir.lengthSq() > 0) {
        moveDir.normalize();
        posX = Math.max(-7, Math.min(7, posX + moveDir.x * speed));
        posZ = Math.max(-7, Math.min(7, posZ + moveDir.z * speed));
      }

      updateLogic();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
